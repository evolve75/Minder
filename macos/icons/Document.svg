<!-- macOS document icon for .minder files: a page with a folded corner,
     the Minder bubble and the file type label. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b3f5"/>
      <stop offset="1" stop-color="#2a68c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <path d="M212,132 H652 L812,292 V900 H212 Z" fill="#000000" opacity="0.28" filter="url(#shadow)" transform="translate(0,14)"/>
  <path d="M212,112 H652 L812,272 V880 H212 Z" fill="url(#page)" stroke="#c4cad4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M652,112 V272 H812 Z" fill="#dfe3ea" stroke="#c4cad4" stroke-width="3" stroke-linejoin="round"/>
  <rect x="292" y="292" width="440" height="440" rx="96" fill="url(#badge)"/>
  <image href="../../data/icons/scalable/io.github.phase1geo.minder.svg" x="282" y="292" width="460" height="460"/>
  <text x="512" y="838" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#8590a2">MINDER</text>
</svg>
