<!-- macOS application icon: the Minder bubble on a rounded-square tile that
     follows the macOS icon grid (1024 canvas, 824 body). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b3f5"/>
      <stop offset="1" stop-color="#2a68c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="100" y="118" width="824" height="824" rx="186" fill="#000000" opacity="0.28" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#1f4f9c" stroke-opacity="0.5" stroke-width="2"/>
  <image href="../../data/icons/scalable/io.github.phase1geo.minder.svg" x="232" y="222" width="560" height="560"/>
</svg>
