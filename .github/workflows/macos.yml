name: macOS build

# Builds Minder on macOS, runs the unit tests and builds the unsigned .app
# whenever a pull request is opened or updated, and on pushes to master and the macOS branches.
on:
  pull_request:
  push:
    branches: [master, features/macos-port, features/macos-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install dependencies
      run: brew bundle --file=Brewfile

    - name: Configure
      run: |
        source macos/env.sh
        meson setup build-mac -Dgranite=false -Dlatex=false

    - name: Build
      run: |
        source macos/env.sh
        meson compile -C build-mac

    - name: Test
      run: |
        source macos/env.sh
        meson test -C build-mac --print-errorlogs

    - name: Build the .app bundle
      run: |
        source macos/env.sh
        macos/make-app.sh

    - name: Archive the .app
      run: ditto -c -k --keepParent build-app/Minder.app Minder-macos-unsigned.zip

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Minder-macos-unsigned
        path: Minder-macos-unsigned.zip
        retention-days: 7
